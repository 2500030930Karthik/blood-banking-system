<!DOCTYPE html>
<html>

<head>
    <title>RECEIVER REQUEST</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
        }

        h2 {
            color: rgb(219, 20, 20);
        }

        nav {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #b30000;
        }

        form {
            background: #b30000;
            padding: 20px;
            width: 400px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 10px;
            color: white;
        }

        input, select {
            padding: 8px;
            margin-top: 5px;
            width: 95%;
        }

        button {
            background: white;
            color: #b30000;
            padding: 10px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<nav>

    <h2>Blood Donation</h2>

    <div>
        <a href="login project.html">Home</a>
        <a href="donor.html">Donor</a>
        <a href="Receiver.html">Receiver</a>
        <a href="inventory.html">Inventory</a>
        <a href="#">Contact</a>
    </div>

</nav>

<h1>🩸 Blood Request</h1>

<form onsubmit="requestBlood(event)">

    <label>Patient Name:</label>
    <input type="text" placeholder="Enter patient name" required>

    <label>Age:</label>
    <input type="number" placeholder="Enter age" required>

    <label>Blood Group Required:</label>

    <select id="blood" required>

        <option value="">Select Group</option>

        <option value="Apositive">A+</option>
        <option value="Anegative">A-</option>
        <option value="Bpositive">B+</option>
        <option value="Bnegative">B-</option>
        <option value="ABpositive">AB+</option>
        <option value="ABnegative">AB-</option>
        <option value="Opositive">O+</option>
        <option value="Onegative">O-</option>

    </select>

    <label>Hospital Name:</label>
    <input type="text" placeholder="Enter hospital name" required>

    <label>State:</label>
    <input type="text" id="state" placeholder="Enter State" required>

    <label>City:</label>
    <input type="text" id="city" placeholder="Enter city" required>

    <label>Phone Number:</label>
    <input type="tel" placeholder="Enter phone number" required>

    <label>Blood Units Required:</label>
    <input type="number" id="units" placeholder="Enter units" min="1" required>

    <button type="submit">Request Blood</button>

</form>

<script>

    function requestBlood(event) {

        event.preventDefault();

        let blood = document.getElementById("blood").value;

        let state = document.getElementById("state").value.toLowerCase();

        let city = document.getElementById("city").value.toLowerCase();

        let units = Number(document.getElementById("units").value);

        let donors = JSON.parse(localStorage.getItem("donors")) || [];

        let matchingDonors = donors.filter(function(donor) {

            return donor.blood == blood &&
                   donor.state == state &&
                   donor.city == city;

        });

        let available = Number(localStorage.getItem(blood) || 0);

        if (matchingDonors.length >= units && available >= units) {

            localStorage.setItem(blood, available - units);

            alert("Matching Donor Found! Blood Request Successful!");

            window.location.href = "inventory.html";

        }

        else if (matchingDonors.length == 0) {

            alert("No Matching Donor Found!");

        }

        else {

            alert("Blood Not Available!");

        }

    }

</script>

</body>

</html>
